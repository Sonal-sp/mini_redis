[package]
name = "mini-redis-core"
version = "0.1.0"
edition = "2021"
description = "Core library for Mini Redis containing RESP protocol parser, async storage engine, AOF persistence, and client SDK"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
tokio-stream = { version = "0.1", features = ["sync"] }
bytes = "1"
parking_lot = "0.12"
tracing = "0.1"
thiserror = "1"
anyhow = "1"
async-trait = "0.1"
